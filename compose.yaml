services:
  app:
    build: .
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - sqlite_data:/app/data
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
volumes:
  node_modules:
  sqlite_data:
